name: Supabase CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Check Edge Function types
        working-directory: supabase/functions/merchant-v1
        run: deno task check
