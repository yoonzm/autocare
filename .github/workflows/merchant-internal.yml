name: Merchant Build

on:
  workflow_dispatch:
    inputs:
      backend_environment:
        description: Backend environment (development uses the Cloud test project)
        type: choice
        options: [production, development]
        default: production
  push:
    branches: ["**"]
    paths:
      - "apps/merchant/**"
      - "packages/**"
      - ".github/workflows/merchant-internal.yml"

permissions:
  contents: read

concurrency:
  group: autocare-merchant-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9
  APP_VERSION: 1.0.0
  MERCHANT_BACKEND_ENV: ${{ inputs.backend_environment || 'production' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      merchant: ${{ steps.paths.outputs.merchant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect affected modules
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'merchant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD^"
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(apps/merchant/|packages/)' "$RUNNER_TEMP/changed-files"; then
            echo 'merchant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'merchant=false' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Flutter
        if: needs.changes.outputs.merchant == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 600 \
            -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test async_kit
        if: needs.changes.outputs.merchant == 'true'
        working-directory: packages/async_kit
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze and test supabase_adapter
        if: needs.changes.outputs.merchant == 'true'
        working-directory: packages/supabase_adapter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze and test merchant
        if: needs.changes.outputs.merchant == 'true'
        working-directory: apps/merchant
        run: |
          flutter pub get
          flutter analyze
          flutter test

  ios:
    needs: [changes, validate]
    if: >-
      needs.changes.outputs.merchant == 'true' &&
      vars.ENABLE_MERCHANT_TESTFLIGHT == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feat/merchant-supabase-v1')
    runs-on: macos-15
    environment: merchant-testflight
    defaults:
      run:
        working-directory: apps/merchant
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode with iOS 26 SDK
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode_*.app'):
              match = re.fullmatch(r'Xcode_(\d+)\.(\d+)(?:\.(\d+))?\.app', path.name)
              if match and int(match[1]) >= 26:
                  candidates.append((tuple(int(v or 0) for v in match.groups()), path))
          if not candidates:
              raise SystemExit('Runner needs a stable Xcode 26 or later installation')
          chosen = max(candidates)[1] / 'Contents/Developer'
          subprocess.run(['sudo', 'xcode-select', '--switch', str(chosen)], check=True)
          PY
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26

      - name: Check signing configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Set up Flutter
        timeout-minutes: 15
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 600 \
            -o "$RUNNER_TEMP/flutter.zip" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rm "$RUNNER_TEMP/flutter.zip"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        run: |
          flutter pub get

      - name: Generate iOS build configuration
        run: |
          backend_args=()
          if [[ "$MERCHANT_BACKEND_ENV" == development ]]; then
            backend_args+=(--dart-define-from-file=config/dev.json)
          fi
          flutter build ios --config-only --no-codesign --release \
            --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" "${backend_args[@]}"

      - name: Install signing identity and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/install-signing.sh

      - name: Archive and export IPA
        env:
          # 签名只写在 Runner 目标里（读取此变量），不再用命令行覆盖，
          # 否则会连带 Swift Package 插件目标一起要求描述文件而失败
          CI_PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            | tee "$RUNNER_TEMP/archive.log"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" | tee "$RUNNER_TEMP/export.log"

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ipa=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "IPA uploaded: version $APP_VERSION build $GITHUB_RUN_NUMBER. Apple processing follows asynchronously." >> "$GITHUB_STEP_SUMMARY"

      - name: Save IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-Merchant-iOS-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/autocare-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"

  android:
    needs: [changes, validate]
    if: >-
      needs.changes.outputs.merchant == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feat/merchant-supabase-v1')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        timeout-minutes: 15
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 600 \
            -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rm "$RUNNER_TEMP/flutter.tar.xz"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        run: |
          flutter pub get

      - name: Build release APK
        run: |
          backend_args=()
          if [[ "$MERCHANT_BACKEND_ENV" == development ]]; then
            backend_args+=(--dart-define-from-file=config/dev.json)
          fi
          flutter build apk --release \
            --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" "${backend_args[@]}"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCare-Merchant-Android-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/merchant/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
