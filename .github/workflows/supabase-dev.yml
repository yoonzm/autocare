name: Supabase Dev

on:
  push:
    branches:
      - main
      - feat/merchant-supabase-v1
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-dev.yml"

permissions:
  contents: read

concurrency:
  group: autocare-supabase-dev
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Check Edge Function types
        working-directory: supabase/functions/merchant-v1
        run: deno task check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: supabase-dev
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEV_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wghsytekrmpcofpugyua
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject untracked database migrations
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # TODO: Dashboard 已应用的首个迁移尚未登记在 CLI 历史中。
          # 对齐远端迁移历史、配置独立数据库凭据后，再自动执行 db push。
          if git diff --name-only "$BEFORE" HEAD | grep -q '^supabase/migrations/'; then
            echo '::error::数据库迁移变更尚不能自动部署：先核对并修复 autocare-dev 的 CLI 迁移历史。'
            exit 1
          fi
      - name: Check deployment token
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Deploy merchant-v1 Edge Function
        run: supabase functions deploy merchant-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
