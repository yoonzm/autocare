name: Supabase Dev

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-dev.yml"

permissions:
  contents: read

concurrency:
  group: autocare-supabase-dev
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Check Edge Function types
        working-directory: supabase/functions/merchant-v1
        run: deno task check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/merchant-supabase-v1'
    runs-on: ubuntu-latest
    environment: supabase-dev
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEV_ACCESS_TOKEN }}
      SUPABASE_DB_URL: postgresql://postgres.wghsytekrmpcofpugyua:${{ secrets.SUPABASE_DEV_DB_PASSWORD }}@aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
      SUPABASE_PROJECT_REF: wghsytekrmpcofpugyua
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "${{ secrets.SUPABASE_DEV_DB_PASSWORD }}"
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Verify migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply pending database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Deploy merchant-v1 Edge Function
        run: supabase functions deploy merchant-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
